server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
  prometheus:
    metrics:
      export:
        enabled: true

spring:
  datasource:
    url: jdbc:h2:mem:edgeflow
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  h2:
    console:
      enabled: true
      path: /h2-console
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: latest
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration

edgeflow:
  mock:
    enabled: true
  registry:
    heartbeat-interval-ms: 10000
    expiry-ms: 30000
  health:
    check-interval-ms: 15000
    initial-delay-ms: 5000
    connect-timeout-ms: 2000
    read-timeout-ms: 5000
    failure-threshold: 3
    success-threshold: 2
    thread-pool-size: 10
    check-path-default: /health
  kafka:
    enabled: false
  routes:
    - path-prefix: /api/users
      upstream: http://localhost:8080/mock/users
    - path-prefix: /api/orders
      upstream: http://localhost:8080/mock/orders
    - path-prefix: /api/payments
      upstream: http://localhost:8080/mock/payments